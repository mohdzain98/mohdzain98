name: Metrics

on:
  workflow_dispatch:
  
jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg

          token: ${{ secrets.METRICS_TOKEN }}

          user: mohdzain98

          base: ""

          # ── Languages (existing plugin, unchanged) ─────────────────────
          plugin_languages: yes

          plugin_languages_ignored: >-
            jupyter notebook, html, css, tex, less,
            dockerfile, makefile, qmake, lex,
            cmake, shell, gnuplot, Hack, PHP

          plugin_languages_aliases: >-
            tsx:TypeScript
            jsx:JavaScript

          plugin_languages_categories: programming

          plugin_languages_details: bytes-size, percentage

          plugin_languages_limit: 4

          # ── Activity feed: recent PRs, issues, commits, releases ───────
          plugin_activity: yes
          plugin_activity_limit: 5          # how many events to show
          plugin_activity_days: 14          # lookback window
          plugin_activity_filter: >-
            issue, pr, commit, release
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          # ── Featured repositories ───────────────────────────────────────
          plugin_repositories: yes
          plugin_repositories_featured: >-
            mohdzain98/docschat,
            mohdzain98/surfmind
          plugin_repositories_random: no    # set yes to fill remaining slots randomly
          plugin_repositories_order: >-
            featured, pinned
