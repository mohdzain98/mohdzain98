name: Metrics

on:
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg

          token: ${{ secrets.METRICS_TOKEN }}

          user: mohdzain98

          base: ""

          # ── Languages (existing plugin, unchanged) ─────────────────────
          plugin_languages: yes

          plugin_languages_ignored: >-
            jupyter notebook, html, css, tex, less,
            dockerfile, makefile, qmake, lex,
            cmake, shell, gnuplot, Hack, PHP

          plugin_languages_aliases: >-
            tsx:TypeScript
            jsx:JavaScript

          plugin_languages_categories: programming

          plugin_languages_details: bytes-size, percentage

          plugin_languages_limit: 4

          # NOTE: plugin_activity and plugin_habits are removed — both have
          # unfixed upstream bugs in lowlighter/metrics that crash on null
          # actor/author fields from certain events (force-pushes, deleted
          # or private repos), with no config workaround.
          # See: https://github.com/Ismadrade/Ismadrade/pull/2

          # ── Isometric commit calendar ───────────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year   # full-year also available

          # ── Lines of code added/removed over time ───────────────────────
          plugin_lines: yes
